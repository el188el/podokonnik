name: Сервер (Supabase и бот)

# Нужно один раз задать в Settings → Secrets and variables → Actions:
#   Variables: SUPABASE_PROJECT_REF (и уже знакомые VITE_TG_BOT, VITE_TG_APP)
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, TELEGRAM_BOT_TOKEN

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/tests
        env:
          DENO_NO_PACKAGE_JSON: '1'
      - run: deno check supabase/functions/api/index.ts supabase/functions/bot/index.ts supabase/functions/notify/index.ts
        env:
          DENO_NO_PACKAGE_JSON: '1'

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SITE_URL: ${{ vars.VITE_SITE_URL || 'https://el188el.github.io/podokonnik/' }}
      TG_BOT: ${{ vars.VITE_TG_BOT }}
      TG_APP: ${{ vars.VITE_TG_APP }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0 # закреплено: «latest» ломается на лимите запросов GitHub

      - name: База данных
        run: |
          supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Секреты функций
        env:
          TG_ADMIN_ID: ${{ vars.TG_ADMIN_ID }}
          TG_CHANNEL: ${{ vars.VITE_TG_CHANNEL }}
          DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          set -- TELEGRAM_BOT_TOKEN="$BOT_TOKEN" SITE_URL="$SITE_URL"
          [ -n "$TG_BOT" ] && set -- "$@" TG_BOT="$TG_BOT"
          [ -n "$TG_APP" ] && set -- "$@" TG_APP="$TG_APP"
          [ -n "$TG_ADMIN_ID" ] && set -- "$@" TG_ADMIN_ID="$TG_ADMIN_ID"
          [ -n "$TG_CHANNEL" ] && set -- "$@" TG_CHANNEL="$TG_CHANNEL"
          [ -n "$DISCORD_CLIENT_ID" ] && set -- "$@" DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID"
          [ -n "$DISCORD_CLIENT_SECRET" ] && set -- "$@" DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET"
          supabase secrets set --project-ref "$REF" "$@"

      - name: Функции
        run: supabase functions deploy --project-ref "$REF" --use-api

      - name: Подключить бота (вебхук, команды, кнопка меню)
        if: env.BOT_TOKEN != ''
        run: |
          set -e
          SECRET=$(printf 'podokonnik:webhook' | openssl dgst -sha256 -hmac "$BOT_TOKEN" -hex | sed 's/.* //' | cut -c1-48)
          API="https://api.telegram.org/bot$BOT_TOKEN"
          curl -sf "$API/setWebhook" -H 'Content-Type: application/json' \
            -d "{\"url\":\"https://$REF.supabase.co/functions/v1/bot\",\"secret_token\":\"$SECRET\",\"allowed_updates\":[\"message\",\"pre_checkout_query\",\"callback_query\",\"my_chat_member\"]}" > /dev/null
          curl -sf "$API/setMyCommands" -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"start","description":"Открыть подоконник"},{"command":"notify","description":"Вкл/выкл напоминания"},{"command":"help","description":"Как играть"},{"command":"paysupport","description":"Помощь с покупками"},{"command":"terms","description":"Условия покупок"},{"command":"plant","description":"Растение для группового чата"}]}' > /dev/null
          curl -sf "$API/setChatMenuButton" -H 'Content-Type: application/json' \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"🪴 Играть\",\"web_app\":{\"url\":\"$SITE_URL\"}}}" > /dev/null
          echo "Бот подключён"

      - name: Расписание напоминаний (pg_cron)
        if: env.BOT_TOKEN != ''
        run: |
          SECRET=$(printf 'podokonnik:cron' | openssl dgst -sha256 -hmac "$BOT_TOKEN" -hex | sed 's/.* //' | cut -c1-48)
          curl -sf -X POST "https://$REF.supabase.co/functions/v1/notify?setup=1" -H "x-cron-secret: $SECRET"
          echo
